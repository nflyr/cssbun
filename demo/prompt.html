<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Document</title>
   </head>
   <body>
      <div class="agent-prompt-container">
         <textarea id="promptInput" placeholder="Ask Copilot or type @to reference files..." rows="1"></textarea>

         <div class="prompt-toolbar">
            <div class="toolbar-left">
               <button class="tool-pill" title="Attach Context">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                     <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                  </svg>
                  <span>Add Context</span>
               </button>
               <button class="tool-pill" title="Use Agent">
                  <span>@agent</span>
               </button>
            </div>

            <div class="toolbar-right">
               <span class="token-hint">Ctrl+I</span>
               <button id="sendBtn" class="send-button" disabled>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                     <line x1="12" y1="19" x2="12" y2="5"></line>
                     <polyline points="5 12 12 5 19 12"></polyline>
                  </svg>
               </button>
            </div>
         </div>
      </div>

      <style>
         .agent-prompt-container {
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #cccccc;
            box-sizing: border-box;
            transition: border-color 0.2s;
         }

         .agent-prompt-container:focus-within {
            border-color: #007acc; /* VS Code blue focus ring */
         }

         .agent-prompt-container textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            /* Modern CSS property for auto-sizing */
            field-sizing: content;
            max-height: 200px;
            margin: 0;
            padding: 0;
         }

         .agent-prompt-container textarea::placeholder {
            color: #666666;
         }

         .prompt-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #2a2a2a;
         }

         .toolbar-left,
         .toolbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
         }

         .tool-pill {
            background: #2a2a2a;
            border: 1px solid #3c3c3c;
            color: #b0b0b0;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition:
               background 0.15s,
               color 0.15s;
         }

         .tool-pill:hover {
            background: #383838;
            color: #ffffff;
         }

         .token-hint {
            font-size: 11px;
            color: #555555;
            margin-right: 4px;
         }

         .send-button {
            background: #007acc;
            border: none;
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition:
               opacity 0.15s,
               background 0.15s;
         }

         .send-button:disabled {
            background: #2a2a2a;
            color: #555555;
            cursor: not-allowed;
         }

         .send-button:not(:disabled):hover {
            background: #0098ff;
         }
      </style>

      <script>
         const textarea = document.getElementById("promptInput");
         const sendBtn = document.getElementById("sendBtn");

         // Enable/disable send button based on text input content
         textarea.addEventListener("input", () => {
            const hasText = textarea.value.trim().length > 0;
            sendBtn.disabled = !hasText;
         });
      </script>
   </body>
</html>
